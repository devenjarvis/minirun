name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kit:
    name: MiniRunKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
      - run: scripts/ci-step.sh linux-swift-test swift test
      - if: failure()
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE" && scripts/publish-ci-logs.sh "linux-${{ github.run_id }}"

  worker:
    name: Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: ../scripts/ci-step.sh worker-typecheck npm run typecheck
      - run: ../scripts/ci-step.sh worker-test npm test

  mac:
    name: macOS build + simulator smoke test
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Xcode version
        id: xcode
        run: |
          xcodebuild -version && swift --version
          echo "version=$(xcodebuild -version | tr -d '\n ' )" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Restore frameworks
        id: frameworks
        uses: actions/cache/restore@v4
        with:
          path: Vendor
          key: frameworks-${{ runner.os }}-${{ hashFiles('scripts/build-frameworks.sh') }}-${{ steps.xcode.outputs.version }}
      - name: Build FBSimulatorControl frameworks
        if: steps.frameworks.outputs.cache-hit != 'true'
        run: scripts/ci-step.sh frameworks ./scripts/build-frameworks.sh
      - name: Save frameworks
        if: steps.frameworks.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Vendor
          key: frameworks-${{ runner.os }}-${{ hashFiles('scripts/build-frameworks.sh') }}-${{ steps.xcode.outputs.version }}
      - name: Build minirun
        run: scripts/ci-step.sh swift-build swift build
      - name: Unit tests
        run: scripts/ci-step.sh swift-test swift test
      - name: Simulator smoke test
        # Leaves its first simulator booted so the relay test below doesn't wait minutes for another first boot.
        env:
          MINIRUN_SMOKE_KEEP: "1"
        run: scripts/ci-step.sh smoke ./scripts/smoke-test.sh
      - name: Relay end-to-end test (wrangler dev + minirun serve)
        run: |
          (cd worker && npm ci)
          scripts/ci-step.sh e2e-relay ./scripts/e2e-relay.sh
      - name: Publish screenshots
        if: success() && github.ref == 'refs/heads/main'
        run: scripts/publish-ci-logs.sh "mac-${{ github.run_id }}"
      - name: Publish logs on failure
        if: failure()
        run: |
          mkdir -p ci-logs/minirun ci-logs/tmp
          cp -R ~/Library/Logs/minirun/. ci-logs/minirun/ 2>/dev/null || true
          cp /tmp/minirun-*.txt /tmp/minirun-*.jpg ci-logs/tmp/ 2>/dev/null || true
          scripts/publish-ci-logs.sh "mac-${{ github.run_id }}"
      - name: Clean up simulators
        if: always()
        run: |
          for sim in $(xcrun simctl list devices --json | python3 -c 'import json,sys; print(" ".join(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("minirun-smoke")))'); do
            xcrun simctl shutdown "$sim" 2>/dev/null || true
            xcrun simctl delete "$sim" 2>/dev/null || true
          done
          # Otherwise the runner spends over a minute terminating it as an orphan process. Not on
          # self-hosted Macs, where Simulator.app may be showing other sessions' simulators.
          if [[ "$RUNNER_ENVIRONMENT" == "github-hosted" ]]; then killall -9 Simulator 2>/dev/null || true; fi
