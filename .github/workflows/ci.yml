name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kit:
    name: MiniRunKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
      - run: scripts/ci-step.sh linux-swift-test swift test
      - if: failure()
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE" && scripts/publish-ci-logs.sh "linux-${{ github.run_id }}"

  worker:
    name: Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: ../scripts/ci-step.sh worker-typecheck npm run typecheck
      - run: ../scripts/ci-step.sh worker-test npm test
      - name: worker/dist matches the source
        # `minirun worker deploy` uploads the committed bundle, so it must be rebuilt with every change.
        run: |
          ../scripts/ci-step.sh worker-bundle npm run bundle
          git diff --exit-code -- dist || { echo "::error::worker/dist is stale. Run npm run bundle in worker/ and commit it."; exit 1; }

  mac:
    name: macOS build + simulator smoke test
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Xcode version
        id: xcode
        run: |
          xcodebuild -version && swift --version
          echo "version=$(xcodebuild -version | tr -d '\n ' )" >> "$GITHUB_OUTPUT"
      - name: Turn off Spotlight
        # It indexes gigabytes of simulator files, and on the runner's slow disk that stalls boots and builds.
        if: runner.environment == 'github-hosted'
        run: sudo mdutil -a -i off
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Restore frameworks
        id: frameworks
        uses: actions/cache/restore@v4
        with:
          path: Vendor
          key: frameworks-${{ runner.os }}-${{ hashFiles('scripts/build-frameworks.sh') }}-${{ steps.xcode.outputs.version }}
      - name: Build FBSimulatorControl frameworks
        if: steps.frameworks.outputs.cache-hit != 'true'
        run: scripts/ci-step.sh frameworks ./scripts/build-frameworks.sh
      - name: Save frameworks
        if: steps.frameworks.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Vendor
          key: frameworks-${{ runner.os }}-${{ hashFiles('scripts/build-frameworks.sh') }}-${{ steps.xcode.outputs.version }}
      - name: Build minirun
        run: scripts/ci-step.sh swift-build swift build
      - name: Unit tests
        run: scripts/ci-step.sh swift-test swift test
      - name: Build the menu bar app
        # With the daemon, frameworks and Worker inside, as install.sh and releases build it. The
        # script runs the bundled helper once, which fails if it can't find its frameworks.
        run: scripts/ci-step.sh menu-app scripts/install-app.sh --build-only --with-daemon "$(swift build --show-bin-path)"
      # The smoke test clones its simulators from a template that has already booted once, which
      # skips the 6-7 minute first boot. Cached, so most runs don't make one at all.
      - name: Simulator template key
        id: template
        run: echo "key=sim-template-v2-${{ steps.xcode.outputs.version }}-$(scripts/sim-template.sh key)" >> "$GITHUB_OUTPUT"
      - name: Restore simulator template
        id: template-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/sim-template
          key: ${{ steps.template.outputs.key }}
      - name: Install simulator template
        if: steps.template-cache.outputs.cache-hit == 'true'
        run: scripts/sim-template.sh restore ~/sim-template
      - name: Simulator smoke test
        # Leaves its first simulator booted so the relay test below doesn't wait for another boot.
        env:
          MINIRUN_SMOKE_KEEP: "1"
        run: scripts/ci-step.sh smoke ./scripts/smoke-test.sh
      - name: Stage simulator template
        id: template-stage
        if: always() && steps.template-cache.outputs.cache-hit != 'true'
        run: |
          scripts/sim-template.sh save ~/sim-template
          [[ -d ~/sim-template ]] && echo "staged=true" >> "$GITHUB_OUTPUT" || true
      - name: Save simulator template
        if: always() && steps.template-stage.outputs.staged == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/sim-template
          key: ${{ steps.template.outputs.key }}
      - name: Relay end-to-end test (wrangler dev + minirun serve)
        run: |
          (cd worker && npm ci)
          scripts/ci-step.sh e2e-relay ./scripts/e2e-relay.sh
      - name: Publish screenshots
        if: success() && github.ref == 'refs/heads/main'
        run: scripts/publish-ci-logs.sh "mac-${{ github.run_id }}"
      - name: Publish logs on failure
        if: failure()
        run: |
          mkdir -p ci-logs/minirun ci-logs/tmp
          cp -R ~/Library/Logs/minirun/. ci-logs/minirun/ 2>/dev/null || true
          cp /tmp/minirun-*.txt /tmp/minirun-*.jpg ci-logs/tmp/ 2>/dev/null || true
          scripts/publish-ci-logs.sh "mac-${{ github.run_id }}"
      - name: Clean up simulators and the Mac fixture app
        if: always()
        run: |
          # The smoke test quits it, unless it stopped partway.
          pkill -x HelloMacApp 2>/dev/null || true
          for sim in $(xcrun simctl list devices --json | python3 -c 'import json,sys; print(" ".join(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("minirun-smoke")))'); do
            xcrun simctl shutdown "$sim" 2>/dev/null || true
            xcrun simctl delete "$sim" 2>/dev/null || true
          done
          # Otherwise the runner spends over a minute terminating it as an orphan process. Not on
          # self-hosted Macs, where Simulator.app may be showing other sessions' simulators.
          if [[ "$RUNNER_ENVIRONMENT" == "github-hosted" ]]; then killall -9 Simulator 2>/dev/null || true; fi
