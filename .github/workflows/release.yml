name: Release

# Builds minirun.app with the daemon, frameworks and Worker inside, and attaches it to a GitHub
# Release. The build is ad-hoc signed and not notarized; the README says how to open it.
#
# Releasing is a merge: when main's MiniRun.version (which must match App/project.yml and
# worker/src/version.ts) has no vX.Y.Z tag yet, this builds it and creates the release, which
# creates the tag on that commit. Pushing a tag by hand still works, and so does running it from
# the Actions tab (rebuilds an existing release, or releases main's version).

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.3.0 (default: main's version)"
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Decide what to release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      ref: ${{ steps.decide.outputs.ref }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: decide
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -nE 's/.*static let version = "([^"]+)".*/\1/p' Sources/MiniRunKit/Version.swift)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"; ref="$GITHUB_REF_NAME"; release=true
          elif [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"; ref="$INPUT_TAG"; release=true
          else
            # A push to main (or a run without a tag): release this commit if its version is new.
            tag="v$version"; ref="$GITHUB_SHA"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
                release=false; echo "$tag already exists; nothing to release."
              else
                ref="$tag"; release=true   # run by hand: rebuild the existing release
              fi
            else
              release=true; echo "Releasing $tag from $GITHUB_SHA."
            fi
          fi
          { echo "tag=$tag"; echo "ref=$ref"; echo "release=$release"; } >> "$GITHUB_OUTPUT"

  app:
    name: Build and publish minirun.app
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.ref }}
      - name: Tag matches the version
        run: |
          version=$(sed -nE 's/.*static let version = "([^"]+)".*/\1/p' Sources/MiniRunKit/Version.swift)
          [[ "$TAG" == "v$version" ]] || { echo "::error::Tag $TAG doesn't match MiniRun.version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | tr -d '\n ' )" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Restore frameworks
        id: frameworks
        uses: actions/cache/restore@v4
        with:
          path: Vendor
          key: frameworks-${{ runner.os }}-${{ hashFiles('scripts/build-frameworks.sh') }}-${{ steps.xcode.outputs.version }}
      - name: Build FBSimulatorControl frameworks
        if: steps.frameworks.outputs.cache-hit != 'true'
        run: ./scripts/build-frameworks.sh
      - name: Build minirun
        run: swift build -c release
      - name: Build the app
        run: scripts/install-app.sh --build-only --with-daemon "$(swift build -c release --show-bin-path)"
      - name: Zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent .build/app/Build/Products/Release/minirun.app "minirun-$VERSION.zip"
          shasum -a 256 "minirun-$VERSION.zip" | tee "minirun-$VERSION.zip.sha256"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "minirun $VERSION for macOS 26 or later on Apple silicon."
            echo
            echo "This build is ad-hoc signed and not notarized, so macOS blocks it at first. After unzipping:"
            echo
            echo '    mv minirun.app /Applications/'
            echo '    xattr -dr com.apple.quarantine /Applications/minirun.app'
            echo '    open /Applications/minirun.app'
            echo
            echo "(or open it once, then allow it under System Settings → Privacy & Security → Open Anyway)."
            echo "The app sets up minirun serve and walks you through the Worker. After that it installs new"
            echo "releases by itself (Settings → General → Install updates automatically)."
            # This version's section of CHANGELOG.md, without its heading.
            changes=$(awk -v v="## $VERSION" '$0 == v { on = 1; next } on && /^## / { exit } on' CHANGELOG.md)
            if [[ -n "$changes" ]]; then
              echo
              echo "## What's new"
              echo "$changes"
            fi
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "minirun-$VERSION.zip" "minirun-$VERSION.zip.sha256" --clobber
          else
            # Creates the tag on the commit that was built if it doesn't exist yet.
            gh release create "$TAG" "minirun-$VERSION.zip" "minirun-$VERSION.zip.sha256" --title "minirun $VERSION" --notes-file notes.md --target "$(git rev-parse HEAD)"
          fi
