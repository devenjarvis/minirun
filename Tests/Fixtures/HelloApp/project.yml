name: HelloApp
options:
  bundleIdPrefix: dev.minirun
  deploymentTarget:
    iOS: "17.0"
targets:
  HelloApp:
    type: application
    platform: iOS
    sources: [HelloApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.minirun.HelloApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
